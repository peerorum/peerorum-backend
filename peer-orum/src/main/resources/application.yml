spring:
  application:
    name: peer-orum

  datasource:
    url: jdbc:mysql://${DB_HOST}:3306/peerorumdb?useSSL=false&serverTimezone=Asia/Seoul
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: true

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  # OAuth2 configuration (Placeholder for KAKAO, GOOGLE)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope:
              - profile
              - email
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "${OAUTH2_REDIRECT_BASE_URL:http://localhost:8080}/login/oauth2/code/{registrationId}"
            scope:
              - profile_nickname
              - account_email
        provider:
          google:
            authorization-uri: "https://accounts.google.com/o/oauth2/v2/auth?prompt=select_account"
          kakao:
            authorization-uri: "https://kauth.kakao.com/oauth/authorize?prompt=login"
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  # Mail configuration (Placeholder for SMTP)
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:placeholder}
    password: ${MAIL_PASSWORD:placeholder}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000 # 1 day
  refresh-expiration: 1209600000 # Refresh Token: 14 days

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

gemini:
  api:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent
    key: ${GEMINI_API_KEY:mock_key}
