spring:
  datasource:
    url: "jdbc:mysql://${DB_HOST}:3306/peer_orum_db?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&sslMode=REQUIRED"
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    defer-datasource-initialization: false

  sql:
    init:
      mode: never